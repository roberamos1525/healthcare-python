      required:
        - line1
        - line2
        - city
        - state
        - postalCode
      type: object
      properties:
        line1:
          type:
            - 'null'
            - string
        line2:
          type:
            - 'null'
            - string
        city:
          type:
            - 'null'
            - string
        state:
          type:
            - 'null'
            - string
        postalCode:
          type:
            - 'null'
            - string
    AdministrativeGender:
      enum:
        - female
        - male
        - other
        - unknown
      description: 'Administrative gender, aligned with the HL7 FHIR R4 AdministrativeGender value set.'
    AppointmentDto:
      required:
        - id
        - status
        - startsAt
        - endsAt
        - visitType
        - reason
        - bookingChannel
        - patient
        - provider
        - location
        - checkedInAt
        - startedAt
        - completedAt
        - cancelledAt
        - cancellationReason
        - version
