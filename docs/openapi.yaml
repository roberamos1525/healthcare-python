openapi: '3.1.1'
info:
  title: HealthCare Platform API
  description: 'REST API of the HealthCare management platform. Tenant-scoped endpoints require the X-Organization-Id header. Timestamps are UTC (ISO 8601), identifiers are UUIDs, enumerations are snake_case strings, and errors are RFC 9457 problem details with a machine-readable `code`. List endpoints accept `page` and `pageSize` (maximum 100).'
  version: 1.0.0
paths:
  /api/v1/appointments:
    get:
      tags:
        - Appointments
      summary: Lists appointments visible to the caller.
      parameters:
        - name: ProviderId
          in: query
          schema:
            type: string
            format: uuid
        - name: PatientId
          in: query
          schema:
            type: string
            format: uuid
        - name: LocationId
          in: query
          schema:
            type: string
            format: uuid
        - name: Status
          in: query
          schema:
            $ref: '#/components/schemas/AppointmentStatus'
        - name: From
          in: query
          schema:
            type:
              - 'null'
              - string
            format: date-time
        - name: To
          in: query
          schema:
            type:
              - 'null'
              - string
            format: date-time
        - name: Sort
          in: query
          schema:
            type: string
        - name: Page
          in: query
          description: One-based page number.
          schema:
            type: integer
            format: int32
        - name: PageSize
          in: query
          description: 'Number of items per page, between 1 and 100.'
          schema:
            type: integer
            format: int32
        - name: SafePage
          in: query
          description: Returns the page number clamped to at least 1.
          schema:
            type: integer
            format: int32
        - name: SafePageSize
          in: query
          description: Returns the page size clamped to the allowed range.
          schema:
            type: integer
            format: int32
        - name: X-Organization-Id
          in: header
          description: Identifier of the organization the request applies to. The caller's access to it is verified on every request.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PagedResultOfAppointmentDto'
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResultOfAppointmentDto'
            text/json:
              schema:
                $ref: '#/components/schemas/PagedResultOfAppointmentDto'
        default:
          description: 'Error response. Common statuses: 400 validation, 401 unauthenticated, 403 forbidden, 404 not found, 409 conflict, 422 business rule violation, 429 rate limited.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - bearerAuth: [ ]
    post:
      tags:
        - Appointments
      summary: "Books an appointment. The Idempotency-Key header is required; repeating a request with the same key\r\nreturns the original appointment. A slot that is no longer free yields 409."
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
        - name: X-Organization-Id
          in: header
          description: Identifier of the organization the request applies to. The caller's access to it is verified on every request.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookAppointmentRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/BookAppointmentRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/BookAppointmentRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AppointmentDto'
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDto'
            text/json:
              schema:
                $ref: '#/components/schemas/AppointmentDto'
        default:
          description: 'Error response. Common statuses: 400 validation, 401 unauthenticated, 403 forbidden, 404 not found, 409 conflict, 422 business rule violation, 429 rate limited.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - bearerAuth: [ ]
