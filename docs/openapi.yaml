          format: uuid
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        visitType:
          $ref: '#/components/schemas/VisitType'
        reason:
          type:
            - 'null'
            - string
        bookingChannel:
          $ref: '#/components/schemas/BookingChannel'
        patient:
