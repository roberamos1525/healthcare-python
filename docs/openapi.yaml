            - string
          format: date-time
        startedAt:
          type:
            - 'null'
            - string
          format: date-time
        completedAt:
          type:
            - 'null'
            - string
          format: date-time
        cancelledAt:
          type:
            - 'null'
            - string
          format: date-time
