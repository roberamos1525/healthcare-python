[project]
name = "healthcare"
version = "1.0.0"
description = "HealthCare platform backend (Python): multi-tenant practice management API for US healthcare organizations."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.165",
    "uvicorn>=0.54",
    "httptools>=0.9",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1.9",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "pyjwt>=2.15",
    "cryptography>=50.0",
    "redis>=8.1",
    "aiosmtplib>=5.1",
    "aio-pika>=10.2",
    "opentelemetry-api>=1.45",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-pyyaml>=6.0",
]
# Fallback PostgreSQL for the integration tests when HEALTHCARE_TEST_POSTGRES is not set (needs Docker).
containers = ["testcontainers[postgres]>=4.10"]

[project.scripts]
healthcare = "healthcare.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthcare"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "C4", "SIM", "RUF", "D"]
ignore = [
    "D203", "D213", "D105", "D107", "D100", "D104",
    "S101", "S105", "S106", "S608", "S311",
    "RUF001", "RUF002", "RUF003",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 120 columns; reviewed SQL and message strings may run to 130.
max-line-length = 130

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["healthcare"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "aio_pika.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs PostgreSQL (HEALTHCARE_TEST_POSTGRES)"]
filterwarnings = ["ignore::DeprecationWarning:uvicorn.*", "ignore::DeprecationWarning:websockets.*"]
