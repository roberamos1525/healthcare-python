name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      HEALTHCARE_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=ci_only_password;Database=postgres
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"

      - name: Install Python and the locked dependencies
        run: |
          uv python install 3.14
          uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests

      - name: Type check (strict)
        run: uv run mypy --strict src tests

      - name: Check dependencies for known vulnerabilities
        run: uvx pip-audit --strict --progress-spinner off -r <(uv export --frozen --no-dev --no-hashes --format requirements-txt)

      - name: Test (unit, integration, security and contract)
        run: uv run pytest -q

  container:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t healthcare-api:${{ github.sha }} .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: healthcare-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
